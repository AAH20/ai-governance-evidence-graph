name: AssuranceGraph Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: assurancegraph validate fixtures/refund-agent/case.json
      - run: assurancegraph compile fixtures/refund-agent/case.json --as-of 2026-09-06 --output assessment.json --fail-on restricted
      - run: assurancegraph change-impact fixtures/refund-agent/case.json fixtures/refund-agent/change.json --output impact.json
      - run: assurancegraph export fixtures/refund-agent/case.json --as-of 2026-09-06 --format oscal --output oscal.json
      - run: assurancegraph export fixtures/refund-agent/case.json --as-of 2026-09-06 --format intoto --output intoto.json
      - run: assurancegraph export fixtures/refund-agent/case.json --as-of 2026-09-06 --format markdown --output brief.md
      - run: assurancegraph economics fixtures/economics.json --output economics.json
      - uses: actions/upload-artifact@v4
        with:
          name: assurance-evidence-${{ matrix.python-version }}
          path: |
            assessment.json
            impact.json
            oscal.json
            intoto.json
            brief.md
            economics.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t assurancegraph:test .
      - run: docker run --rm assurancegraph:test compile fixtures/refund-agent/case.json --as-of 2026-09-06 --output /tmp/assessment.json --fail-on restricted
